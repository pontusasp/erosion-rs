[package]
name = "erosion"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bracket-noise = "0.8.7"
rand = "0.8.5"
serde = { version = "1.0.218", features = ["derive", "rc"] }
serde_json = "1.0.140"
getrandom = { version = "0.2" }
rayon = "1.10.0"
bincode = "1.3.3"
bevy = "0.16.0"
bevy_egui = "0.34.1"

[dependencies.image]
version = "0.24.9"
optional = false

[dependencies.imageproc]
version = "0.23.0"
optional = false

[features]
default = ["wasm", "export"]
export = []
wasm = ["getrandom/js"]
